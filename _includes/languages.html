{% if site.author_language_skills %}
<ul
  style="
    list-style-type: none;
    padding-left: 0;
    margin-top: 15px;
    margin-bottom: 0;
  "
>
  {% for detailed in site.author_language_skills %}
  <li
    class="d-flex justify-content-between align-items-center mb-3"
    style="border-bottom: 1px solid #2b3035; padding-bottom: 10px"
  >
    <span style="font-weight: 600; font-size: 1.05rem"
      >{{detailed.language}}</span
    >
    <span
      style="
        background-color: #2b3035;
        border: 1px solid #495057;
        border-radius: 12px;
        padding: 4px 12px;
        font-size: 0.85rem;
        color: #e9ecef;
      "
    >
      {% if detailed.code %} {{detailed.detail[0]}}
      <span style="opacity: 0.7">({{detailed.detail[1]}})</span>
      {% else %} {{detailed.detail[0]}} {% endif %}
    </span>
  </li>
  {% endfor %}
</ul>
{% endif %}
